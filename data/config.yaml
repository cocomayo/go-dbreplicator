# Main application settings
polling_interval_seconds: 3

# Message Broker configuration
broker:
  type: RABBITMQ # Options: RABBITMQ, KAFKA
  host: localhost
  port: 5672
  topic_or_queue: replication_queue

# Source database configuration
source:
  type: DB  # Options: LOCAL, MOCK, DB
  
  local:
    path: data/source_mock.json
    
  mock:
    api_link: http://localhost:8080/api
    
  db:
    host: localhost
    port: 3306
    user: root
    password: rootpassword
    database: SourceDB

# Destination database configuration
destination:
  type: DB  # Options: LOCAL, DB
  
  local:
    path: data/dest_mock.json
    
  db:
    host: localhost
    port: 3307
    user: root
    password: rootpassword
    database: DestinationDB
